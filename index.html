<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MSA Gateway</title>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root{--bg:#0f0f0f;--card:#1a1a1a;--border:#2a2a2a;--text:#e8e8e8;--muted:#888;--accent:#3b82f6;--ok:#22c55e;--danger:#ef4444;--warn:#eab308}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.wrap{max-width:440px;margin:0 auto}
h1{font-size:1.2rem;text-align:center;margin-bottom:4px}
.sub{text-align:center;font-size:.75rem;color:var(--muted);margin-bottom:16px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:5px;vertical-align:middle}
.dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.dot.warn{background:var(--warn)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:.95rem;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.card .meta{font-size:.72rem;color:var(--muted);margin-bottom:10px}
.card.disabled{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:8px;justify-content:center;margin:8px 0}
.btn{flex:1;max-width:96px;aspect-ratio:1;border:1px solid var(--border);border-radius:14px;background:#121212;color:var(--text);font-size:1.5rem;cursor:pointer}
.btn:active{background:var(--accent);transform:scale(.95)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:8px;border-radius:10px;border:1px solid var(--border);background:#121212;color:var(--muted);font-size:.8rem;cursor:pointer}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.small-btn{padding:10px;border-radius:10px;border:1px solid var(--border);background:#121212;color:var(--text);font-size:.8rem;cursor:pointer}
.small-btn:active{background:var(--accent)}
.toolbar{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.toolbar button{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.78rem;cursor:pointer}
#login{max-width:360px;margin:10vh auto 0;padding:22px 18px;background:var(--card);border:1px solid var(--border);border-radius:16px}
#login h2{text-align:center;margin-bottom:6px;font-size:1.1rem}
#login p.hint{text-align:center;font-size:.75rem;color:var(--muted);margin-bottom:16px}
#login label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:4px}
#login input{width:100%;padding:11px 12px;margin-bottom:12px;border-radius:10px;border:1px solid var(--border);background:#121212;color:var(--text)}
#login button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
#loginErr{text-align:center;color:var(--danger);font-size:.8rem;min-height:1.2em;margin-top:10px}
#app{display:none}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-120%);padding:10px 16px;border-radius:10px;background:#14532d;color:#bbf7d0;font-size:.85rem;font-weight:600;opacity:0;transition:.25s;z-index:99}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.err{background:#450a0a;color:#fecaca}
.credit{text-align:center;margin-top:18px;font-size:.68rem;color:#555}
.status-line{font-size:.78rem;margin:4px 0;color:var(--muted)}
</style>
</head>
<body>
<div id="toast"></div>

<div id="login">
  <h2>MSA Gateway</h2>
  <p class="hint">Sign in to continue</p>
  <label>Username</label>
  <input id="user" type="text" autocomplete="username" autocapitalize="off">
  <label>Password</label>
  <input id="pass" type="password" autocomplete="current-password">
  <button type="button" id="btnLogin" onclick="doLogin()">Sign in</button>
  <p id="loginErr"></p>
</div>

<div id="app" class="wrap">
  <h1>MSA Gateway</h1>
  <p class="sub">
    <span class="dot" id="dotMqtt"></span><span id="txtMqtt">MQTT —</span>
  </p>
  <div class="toolbar">
    <button type="button" onclick="pingAll()">↻ Refresh</button>
    <button type="button" onclick="doLogout()">Log out</button>
  </div>

  <!-- Node status -->
  <div class="card">
    <h2>Nodes</h2>
    <div class="status-line"><span class="dot" id="dotHub"></span>Hub (ESP32): <span id="txtHub">—</span></div>
    <div class="status-line"><span class="dot" id="dotGarage"></span>Parking RF: <span id="txtGarage">—</span></div>
    <div class="status-line"><span class="dot" id="dotAc"></span>AC IR: <span id="txtAc">—</span></div>
    <div class="status-line"><span class="dot" id="dotLight"></span>Lighting: <span id="txtLight">Soon</span></div>
  </div>

  <!-- Parking -->
  <div class="card" id="cardParking">
    <h2>Parking doors <span class="meta" id="parkPath"></span></h2>
    <div class="tabs">
      <button class="tab active" type="button" id="tab0" onclick="selectDoor(0)">1</button>
      <button class="tab" type="button" id="tab1" onclick="selectDoor(1)">2</button>
      <button class="tab" type="button" id="tab2" onclick="selectDoor(2)">3</button>
    </div>
    <div class="btn-row">
      <button class="btn" type="button" onclick="sendGarage('up')">▲</button>
      <button class="btn" type="button" onclick="sendGarage('stop')">⏹</button>
      <button class="btn" type="button" onclick="sendGarage('down')">▼</button>
    </div>
    <p class="meta" style="text-align:center">Commands go Hub → ESP-NOW → RF node</p>
  </div>

  <!-- AC -->
  <div class="card" id="cardAc">
    <h2>Air conditioning</h2>
    <p class="meta">Via Hub → AC node (when node is online)</p>
    <div class="grid2">
      <button class="small-btn" type="button" onclick="sendAc('on')">Power ON</button>
      <button class="small-btn" type="button" onclick="sendAc('off')">Power OFF</button>
      <button class="small-btn" type="button" onclick="sendAc('temp_up')">Temp +</button>
      <button class="small-btn" type="button" onclick="sendAc('temp_down')">Temp −</button>
    </div>
  </div>

  <!-- Lighting placeholder -->
  <div class="card disabled">
    <h2>Lighting</h2>
    <p class="meta">Module not ready yet</p>
  </div>

  <p class="credit">Designed &amp; built by M.S.A</p>
</div>

<script>
const BROKER_URL = "wss://130.185.74.211:8084/mqtt";
const T_CMD    = "garage/hub/cmd";
const T_STATUS = "garage/hub/status";
const T_STATE  = "garage/hub/state";
const T_LEGACY_CMD = "garage/417ca1/cmd";
const T_LEGACY_STATUS = "garage/417ca1/status";
const T_LEGACY_STATE = "garage/417ca1/state";

var client = null, mqttOk = false, mqttUser = "", mqttPass = "";
var activeDoor = 0;
var hubOk = false, garageOk = false, acOk = false;
var hubTimer = null, garageTimer = null, toastTimer = null;

function toast(t, err) {
  var e = document.getElementById("toast");
  e.textContent = t;
  e.className = err ? "err" : "";
  void e.offsetWidth;
  e.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { e.classList.remove("show"); }, 2000);
}
function setDot(id, on) {
  document.getElementById(id).className = "dot" + (on ? " on" : "");
}
function uiConn() {
  setDot("dotMqtt", mqttOk);
  document.getElementById("txtMqtt").textContent = mqttOk ? "Connected" : "Disconnected";
  setDot("dotHub", hubOk);
  document.getElementById("txtHub").textContent = hubOk ? "Online" : "Offline";
  setDot("dotGarage", garageOk);
  document.getElementById("txtGarage").textContent = garageOk ? "Online" : "Offline";
  setDot("dotAc", acOk);
  document.getElementById("txtAc").textContent = acOk ? "Online" : "Offline";
}
function selectDoor(n) {
  activeDoor = n;
  for (var i = 0; i < 3; i++)
    document.getElementById("tab" + i).className = "tab" + (i === n ? " active" : "");
  publish({ cmd: "select_door", door: n, node: "garage" });
}
function publish(obj) {
  if (!client || !mqttOk) { toast("Not connected", true); return; }
  var s = JSON.stringify(obj);
  client.publish(T_CMD, s);
}
function sendGarage(cmd) {
  publish({ cmd: cmd, door: activeDoor, node: "garage" });
  toast(cmd.toUpperCase() + " D" + (activeDoor + 1));
}
function sendAc(cmd) {
  publish({ cmd: "ac_" + cmd, node: "ac" });
  toast("AC " + cmd);
}
function markHub() {
  hubOk = true;
  clearTimeout(hubTimer);
  hubTimer = setTimeout(function () { hubOk = false; uiConn(); }, 20000);
  uiConn();
}
function markGarage() {
  garageOk = true;
  clearTimeout(garageTimer);
  garageTimer = setTimeout(function () { garageOk = false; uiConn(); }, 20000);
  uiConn();
}
function pingAll() {
  publish({ cmd: "ping" });
  publish({ cmd: "ping", node: "garage" });
  toast("Ping…");
}

function showApp() {
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
}
function showLogin(msg) {
  document.getElementById("app").style.display = "none";
  document.getElementById("login").style.display = "block";
  document.getElementById("loginErr").textContent = msg || "";
  document.getElementById("btnLogin").disabled = false;
}

function connectMQTT() {
  if (client) try { client.end(true); } catch (e) {}
  client = mqtt.connect(BROKER_URL, {
    clientId: "web_" + Math.random().toString(16).slice(2, 10),
    clean: true,
    connectTimeout: 12000,
    reconnectPeriod: 4000,
    username: mqttUser,
    password: mqttPass,
    rejectUnauthorized: false
  });
  client.on("connect", function () {
    mqttOk = true;
    uiConn();
    showApp();
    client.subscribe(T_STATUS);
    client.subscribe(T_STATE);
    client.subscribe(T_LEGACY_STATUS);
    client.subscribe(T_LEGACY_STATE);
    setTimeout(pingAll, 400);
  });
  client.on("message", function (t, p) {
    try {
      var d = JSON.parse(p.toString());
      if (d.type === "ack" || d.type === "state") {
        markHub();
        if (d.msg && d.msg !== "HUB OK" && d.msg !== "pong") toast(d.msg);
        if (d.path) document.getElementById("parkPath").textContent = d.path;
        if (d.node_garage || d.msg === "OPEN" || d.msg === "CLOSE" || d.msg === "STOP") markGarage();
        if (d.node_ac) acOk = true;
      }
    } catch (e) {
      markHub();
    }
  });
  client.on("close", function () {
    mqttOk = false; hubOk = false; garageOk = false; uiConn();
  });
}

function doLogin() {
  var u = (document.getElementById("user").value || "").trim();
  var p = document.getElementById("pass").value || "";
  if (!u || !p) {
    document.getElementById("loginErr").textContent = "Enter username and password";
    return;
  }
  document.getElementById("loginErr").textContent = "Connecting…";
  document.getElementById("btnLogin").disabled = true;
  mqttUser = u; mqttPass = p;
  try {
    sessionStorage.setItem("pk_u", u);
    sessionStorage.setItem("pk_p", p);
  } catch (e) {}
  connectMQTT();
  setTimeout(function () {
    if (!mqttOk) {
      showLogin("Login failed — user/pass or network");
      try { sessionStorage.removeItem("pk_u"); sessionStorage.removeItem("pk_p"); } catch (e) {}
    }
  }, 14000);
}
function doLogout() {
  mqttOk = false; hubOk = false; garageOk = false;
  mqttUser = ""; mqttPass = "";
  try { sessionStorage.removeItem("pk_u"); sessionStorage.removeItem("pk_p"); } catch (e) {}
  if (client) try { client.end(true); } catch (e) {}
  client = null;
  document.getElementById("pass").value = "";
  showLogin("");
  uiConn();
}

document.getElementById("pass").addEventListener("keydown", function (e) {
  if (e.key === "Enter") doLogin();
});
uiConn();
try {
  var su = sessionStorage.getItem("pk_u"), sp = sessionStorage.getItem("pk_p");
  if (su && sp) {
    document.getElementById("user").value = su;
    document.getElementById("pass").value = sp;
    doLogin();
  }
} catch (e) {}
</script>
</body>
</html>
